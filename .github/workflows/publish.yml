name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and package without publishing)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance attestation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting and linting
        run: bun run lint-ci

      - name: Typecheck
        run: bun run typecheck

      - name: Build library bundle
        run: bun run build

      - name: Copy README to package
        run: cp README.md packages/react-native-nitro-image-compressor/README.md

      - name: Dry Run Publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          cd packages/react-native-nitro-image-compressor
          npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to NPM Registry
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cd packages/react-native-nitro-image-compressor
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
