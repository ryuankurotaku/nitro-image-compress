name: Publish Release to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: publish-release

jobs:
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create Git tags and GitHub releases
      id-token: write # For npm OIDC trusted publishing & provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if current version needs publishing
        id: check_version
        run: |
          PKG_VERSION=$(node -p "require('./packages/react-native-nitro-image-compressor/package.json').version")
          TAG="v$PKG_VERSION"
          echo "Current package version: $PKG_VERSION (tag: $TAG)"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Tag $TAG already exists on repository. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "🚀 Tag $TAG does not exist yet. Triggering publish!"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.check_version.outputs.should_publish == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (v22 with OIDC support)
        if: steps.check_version.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm CLI for Trusted Publishing
        if: steps.check_version.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check_version.outputs.should_publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build & Publish to NPM
        if: steps.check_version.outputs.should_publish == 'true'
        run: ./scripts/release.sh

      - name: Create Git Tag & Push
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.check_version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check_version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_version.outputs.tag }}"
          gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Cleanup Release Branch
        if: steps.check_version.outputs.should_publish == 'true'
        run: |
          TAG="${{ steps.check_version.outputs.tag }}"
          git push origin --delete "release/$TAG" 2>/dev/null || true
