name: Release & Publish to NPM

on:
  schedule:
    # Runs automatically every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version bump (auto, patch, minor, major, or publish-only)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - publish-only
      dry_run:
        description: 'Dry run (test build and packaging without publishing or pushing)'
        required: false
        default: false
        type: boolean

jobs:
  release-and-publish:
    name: Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating git tags, commits, and GitHub releases
      id-token: write # Required for npm OIDC trusted publishing & provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for conventional commits and changelog

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (v22 with OIDC support)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm CLI for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for new commits since last release
        id: check_changes
        run: |
          # If triggered directly by a GitHub Release or publish-only, skip release-it step
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ github.event.inputs.increment }}" = "publish-only" ]; then
            echo "ℹ️ Triggered via direct release or publish-only. Skipping release-it bump."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git describe --tags --abbrev=0)
          COMMITS_COUNT=$(git rev-list "${LATEST_TAG}..HEAD" --count)
          echo "ℹ️ Found $COMMITS_COUNT commit(s) since $LATEST_TAG."

          if [ "$COMMITS_COUNT" -eq 0 ]; then
            echo "ℹ️ No new commits since $LATEST_TAG. Skipping release and publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git Bot
        if: steps.check_changes.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release-it (Bump, Changelog, Tag & GitHub Release)
        if: steps.check_changes.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INCREMENT_ARG=""
          if [ "${{ github.event.inputs.increment }}" != "" ] && [ "${{ github.event.inputs.increment }}" != "auto" ]; then
            INCREMENT_ARG="${{ github.event.inputs.increment }}"
          fi

          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          echo "🚀 Running release-it..."
          bun x release-it $INCREMENT_ARG --ci $DRY_RUN_ARG

      - name: Build & Publish to NPM
        if: steps.check_changes.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/release.sh ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
