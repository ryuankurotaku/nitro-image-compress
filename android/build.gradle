buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

plugins {
  id "com.android.library"
  id "org.jetbrains.kotlin.android"
}

android {
  namespace "com.nitro.imagecompress"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 26)
    targetSdk safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main {
      java.srcDirs += [
        "src/main/java",
        "../nitrogen/generated/android/kotlin"
      ]
    }
  }
}

dependencies {
  implementation "com.margelo.nitro:core:0.18.0"
  implementation "id.zelory:compressor:3.0.1"
}
